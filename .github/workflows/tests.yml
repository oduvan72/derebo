name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FLASK_SECRET_KEY: github-actions-test-key-not-for-production
      TELEGRAM_BOT_TOKEN: ''
      TELEGRAM_ADMIN_IDS: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install Node dependencies
        run: npm ci
      - name: Build CSS and copy fonts
        run: npm run build:css
      - name: Run tests
        run: python -m unittest discover -s tests -v
