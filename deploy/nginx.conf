server {
    listen 80;
    listen [::]:80;
    server_name drevoeltoi.ru www.drevoeltoi.ru;

    return 301 https://drevoeltoi.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.drevoeltoi.ru;

    ssl_certificate /etc/nginx/ssl/drevoeltoi.ru/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/drevoeltoi.ru/private.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://drevoeltoi.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name drevoeltoi.ru;

    ssl_certificate /etc/nginx/ssl/drevoeltoi.ru/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/drevoeltoi.ru/private.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;

    client_max_body_size 16m;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
    }
}
