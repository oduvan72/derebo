services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:///drevo_zhizni.db}
      PORT: ${PORT:-5000}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:?Set FLASK_SECRET_KEY in .env}
      FLASK_DEBUG: "false"
    ports:
      - "127.0.0.1:${PORT:-5000}:5000"
    volumes:
      - ./instance:/app/instance
      - ./static:/app/static
      - ./templates:/app/templates
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  telegram-bot:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:///drevo_zhizni.db}
      PORT: ${PORT:-5000}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:?Set FLASK_SECRET_KEY in .env}
      FLASK_DEBUG: "false"
    command: ["python", "bot.py"]
    volumes:
      - ./instance:/app/instance
      - ./static:/app/static
      - ./templates:/app/templates
    restart: unless-stopped
